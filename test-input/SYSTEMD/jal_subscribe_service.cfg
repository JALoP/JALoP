enable_tls = true
private_key = "/etc/jalop/TLS_CA_Signed/server/jal_subscriber_v2_server.key.pem";
public_cert = "/etc/jalop/TLS_CA_Signed/server/jal_subscriber_v2_server.cert.pem";
trust_store = "/etc/jalop/TLS_CA_Signed/server/trust_store_dir/jal_subscriber_v2_server.trusted_certs";
db_root = "/var/log/jalop_sub";
port = 8444;
address = "127.0.0.1";
record_type = ["audit", "log", "journal"];
mode = "archive";
session_limit = 100;
network_timeout = 0;
buffer_size = 4096;
digest_algorithms = "sha256";
database_type = "db";
journal_resume_threshold_size = 1048576L; #1024*1024 = 1MB (1,048,576 bytes)
client_certificate_validation = "once";
http_server_thread_pool_size = 9;
seccomp:
{
    enable = true;
    debug = false;
    version = "rhel_8_9";
    rhel_8_9: 
    {
        initial = ["arch_prctl","bind","brk","execve","flock","fstatfs","getdents","getdents64","getpid","getsockname","getsockopt","getrlimit","getrusage","ioctl","listen","newfstatat","prctl","rseq","seccomp","select","set_tid_address","socket","statfs","sysinfo"]
        both = ["access","clone","clone3","close","fcntl","fdatasync","fstat","futex","lseek","mkdir","mmap","mprotect","munmap","open","openat","poll","pread64","pwrite64","read","rename","rt_sigaction","rt_sigprocmask","set_robust_list","setsockopt","stat","write"]
        final = ["accept4","clock_gettime","clock_nanosleep","connect","exit","exit_group","ftruncate","getrandom","getpid","madvise","nanosleep","recvfrom","rt_sigreturn","sched_getaffinity","sched_yield","sendto","sendmsg","shutdown","sysinfo","unlink","writev"]
    };
};
