# the path to the private key, used for TLS negotiation
private_key = "./test-input/TLS_CA_Signed/client/jal_publisher_v2_client.key.pem";
#private_key = "./test-input/TLS_Self_Signed/pub-certs/publisher.key";

# the path to the public cert, used for TLS negotiation
public_cert = "./test-input/TLS_CA_Signed/client/jal_publisher_v2_client.cert.pem";
#public_cert = "./test-input/TLS_Self_Signed/pub-certs/publisher.crt";

#Set this config setting to true to enable the use of self signed certs for TLS.
#WARNING!!! this will disable cert validity checks within libcurl and this should only
#be used for testing and not on a live production system.
allow_self_signed_certs = false;

# UUID used to identify this publisher
publisher_id = "cc0191c2-97e8-4cbf-af13-920d268d68ec";

# time in seconds between checks for new records when none are available
poll_time = 1L;

# time in seconds between attempts to reconnect to peers where the connection has closed
# the special value of -1 can be used to indicated that jald should not attempt reconnects
retry_interval = 30L;

# Network timeout for each session, in minutes. Upon failure to send or receive
# data in this time, a network outage is assumed and the session closes.
# The special value of 0 implies not network timeout is enforced.
network_timeout = 60L;

# path to the root of the database (optional)
db_root = "./testdb";

# path to a directory containing the JALoP schemas (optional)
schemas_root = "./schemas/";

# file storing PID of jald when daemonized.
#pid_file = "/var/log/jalop/jald-pid.txt";

# Log directory of jald when daemonized.
log_dir = "./";

# A list of supported digest algorithms. These algorithms should be ordered by preference
# in a single double-quoted string with a space separating the algorithms.
# Valid values are "sha256", "sha384", and "sha512"
digest_algorithms = "sha256";

# List of subscriber configurations.
peers = ( {
	# the hostname or IP address of the subscriber
	host = "127.0.0.1";
	# the port to connect to
	port = 8444L;
	# the mode of JALoP operation
	# To run JALoP in Archive mode, use "archive" or "archival"
	# To run JALoP in Live mode, use "live"
	mode = "archive";
	# array of digest challenge configuration settings ordered by descending priority
	# Valid values are "on" and "off"
	digest_challenge = ["on"];
	# array of record types to be sent to the subscriber
	# Valid values are "audit", "log", and "journal"
	record_types = ["audit", "log", "journal"];
	# directory containing the CA certificate(s) to use for TLS negotiation
	cert_dir = "./test-input/TLS_CA_Signed/client/trust_store_dir";
	#cert_dir = "./test-input/TLS_Self_Signed/pub-certs/trust_store_dir";
	});

# seccomp will restrict the process to the defined system calls.
# When the process is in the setup phase, at startup, it will be restricted to the
# initial_seccomp_rules, both_seccomp_rules and final_seccomp_rules system call sets. After the setup phase and before the process
# is doing its routine work, it will be further restricted to only the both_seccomp_rules and final_seccomp_rules system call set.
#
seccomp:
{
    enable = false;
    debug = false;
    version = "rhel_8_9";
    rhel_8_9: 
    {
        initial = ["arch_prctl","bind","execve","faccessat2","fstatfs","getcwd","getpid","getrandom","ioctl","listen","lstat","prctl","pread64","prlimit64","readlink","seccomp","set_tid_address","statfs","unlink"]
		both = ["access","brk","clock_nanosleep","clone","clone3","close","connect","fstat","futex","getpid","getrandom","lseek","mmap","mprotect","munmap","nanosleep","newfstatat","open","openat","poll","read","rseq","rt_sigaction","rt_sigprocmask","set_robust_list","setsockopt","socket","stat","write"]
		final = ["accept","exit", "exit_group","fcntl","getdents","getdents64","getpeername","getsockname","getsockopt","gettid","getuid","madvise","mkdir","recvfrom","recvmsg","rmdir","rt_sigreturn","sendmsg","sendto","socketpair","sysinfo","uname"]
	};
    rhel_7: 
    {
       	initial = ["arch_prctl","bind","execve","fstatfs","getcwd","getpid","getrandom","ioctl","listen","lstat","prctl","pread64","prlimit64","readlink","seccomp","set_tid_address","statfs","unlink"]
		both = ["access","brk","clock_nanosleep","clone","close","connect","fstat","futex","getpid","getrandom","lseek","mmap","mprotect","munmap","nanosleep","newfstatat","open","openat","poll","read","rt_sigaction","rt_sigprocmask","set_robust_list","setsockopt","socket","stat","write"]
		final = ["accept","exit", "exit_group","fcntl","getdents","getdents64","getpeername","getsockname","getsockopt","gettid","getuid","madvise","mkdir","recvfrom","recvmsg","rmdir","rt_sigreturn","sendmsg","sendto","socketpair","sysinfo","uname"]
	};
	rhel_8_9_no_filter: 
    {
        initial = ["arch_prctl","execve","faccessat2","getcwd","getrlimit","ioctl","lstat","prctl","readlink","seccomp","set_tid_address","statfs"]
		both = ["access","brk","close","fstat","fstatfs","getdents64","lseek","mmap","mprotect","munmap","newfstatat","open","read","rt_sigaction","rt_sigprocmask","set_robust_list","stat","write"]
		final = ["clock_nanosleep","clone","clone3","connect","exit","exit_group","fcntl","fdatasync","flock","ftruncate","futex","getdents","getpeername","getpid","getrandom","getsockname","getsockopt","gettid","getuid","madvise","mkdir","nanosleep","openat","poll","pread64","pselect6","pwrite64","recvfrom","rename","rmdir","rseq","select","setsockopt","rt_sigreturn","pselect6","sched_yield","sendto","socket","socketpair","sysinfo","uname","writev"]
	};
	rhel_7_no_filter: 
    {
        initial = ["arch_prctl","execve","getcwd","getrlimit","ioctl","lstat","prctl","set_tid_address","seccomp","statfs"]
		both = ["access","brk","close","fstat","fstatfs","lseek","mmap","mprotect","munmap","open","read","rt_sigaction","rt_sigprocmask","set_robust_list","stat","write"]
		final = ["clone","connect","exit","exit_group","fcntl","fdatasync","flock","ftruncate","futex","getpid","getrandom","getdents","getpeername","getsockname","getsockopt","gettid","getuid","madvise","mkdir","nanosleep","openat","poll","pread64","pwrite64","recvfrom","rename","rmdir","rt_sigreturn","sched_yield","select","sendto","setsockopt","socket","sysinfo","uname","writev"]
	};
};

#On certain networks you may have a disruption with a connection between server and client.
#You can configure the maximum retries before giving up and doing a full reconnection.
#a value of 0 would be no retries. The delay between retries is in micro-seconds. 1 million = 1 second.
http_client_retry_count = 50;
http_client_retry_delay = 1000000;

filter_socket_basename = "jald_filter_socket";
