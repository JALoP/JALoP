# The path to the private key, used for TLS.
private_key = "./test-input/TLS_CA_Signed/server/jal_publisher_v1_server.key.pem";

# The path to the public cert, used for TLS.
public_cert = "./test-input/TLS_CA_Signed/server/jal_publisher_v1_server.cert.pem";

# Directory file containing the certificates for the remote peers.
remote_cert_dir = "./test-input/TLS_CA_Signed/server/trust_store_dir";

# The path to the root of the database.
db_root = "./testdb";

# The port the Publisher will listen on.
port = 1234L;

# The IP address (interface) the Publisher will to listen on, or 0.0.0.0 to listen on all.
host = "0.0.0.0";

# How long to wait, in seconds, before polling for records after finding no records
poll_time = 1L;

# file storing PID of jald when daemonized.
#pid_file = "/var/log/jalop/jald-pid.txt";

# Log directory of jald when daemonized.
log_dir = "./";

# A list of supported digest algorithms. These algorithms should be ordered by preference
# in a single double-quoted string with a space separating the algorithms.
# Valid values are "sha256", "sha384", and "sha512"
digest_algorithms = "sha256";

# List of allowed Subscriber peer configurations
peers = ( {
		hosts = ("127.0.0.1");
		subscribe_allow = ("journal", "audit", "log");
	},
	{
		hosts = ("7.7.7.7");
		subscribe_allow = ("journal", "audit", "log");
	},
	{
		hosts = ("8.8.8.8");
		subscribe_allow = ("journal", "audit", "log");
	}  );

# seccomp will restrict the jal-local-store process to the defined system calls.
# When the process is in the setup phase, at startup, it will be restricted to the
# initial_seccomp_rules, both_seccomp_rules and final_seccomp_rules system call sets. After the setup phase and before the process
# is doing its routine work, it will be further restricted to only the both_seccomp_rules and final_seccomp_rules system call set.
