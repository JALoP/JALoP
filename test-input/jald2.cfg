{
    enable = false;
    debug = false;
    version = "rhel_8_9";
    rhel_8_9: 
    {
		initial = ["access","arch_prctl","bind","clone","connect","execve","fstatfs","getcwd","getrandom","getrlimit","getuid","ioctl","listen","lstat","open","prctl","pread64","prlimit64","readlink","seccomp","set_tid_address","stat","sysinfo","unlink"]
