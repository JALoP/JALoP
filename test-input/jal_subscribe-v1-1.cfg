# The path to the private key, used for TLS.
private_key = "./test-input/TLS_CA_Signed/client/jal_subscriber_v1_client.key.pem";

# The path to the public cert, used for TLS.
public_cert = "./test-input/TLS_CA_Signed/client/jal_subscriber_v1_client.cert.pem";

# Directory containing the certificates for the remote peers.
remote_cert = "./test-input/TLS_CA_Signed/client/trust_store_dir";

# The path to the root of the database.
db_root = "./subdb";

# The port to connect on.
port = 1234L;

# The hostname or IP address of the Publisher to subscribe to.
host = "127.0.0.1";

# For subscribe, the maximum number of records to send before sending a 'digest-challenge' message
pending_digest_max = 10L;

# For subscribe, the maximum number of milliseconds to wait, before sending a 'digest-challenge' message
# 1000L = 1 second
pending_digest_timeout = 1000L;

# The supported record types.
data_class = [ "audit", "log", "journal" ];

# Mode to request data in.  May be "archive" or "live".
mode = "archive";

# The time before jal_subscribe ends (HH:MM:SS). Specify 00:00:00 to run continuously.
session_timeout = "00:00:00";

# This window size for the beep channels created
# will be set to this number * 1024 (1k)
# Beep recommends a minimal size of 4k
window_size = 4;

# A list of supported digest algorithms. These algorithms should be ordered by preference
# in a single double-quoted string with a space separating the algorithms.
# Valid values are "sha256", "sha384", and "sha512"
digest_algorithms = "sha256";

# Specify the threshold size at which a journal resume is "worthwhile"
# If a partial journal record is found during session init that exceeds this threshold
# then a journal resume will be performed
# If the partial record is less than this size, the resume will be skipped and the
# record will be transferred from scratch.
# The special value 0 means always resume
# Any negative number disables resume entirely
journal_resume_threshold_size = 1048576L; #1024*1024 = 1MB (1,048,576 bytes)

# seccomp will restrict the jal-local-store process to the defined system calls.
# When the process is in the setup phase, at startup, it will be restricted to the
# initial_seccomp_rules, both_seccomp_rules and final_seccomp_rules system call sets. After the setup phase and before the process
# is doing its routine work, it will be further restricted to only the both_seccomp_rules and final_seccomp_rules system call set.
#
enable_seccomp = false;
seccomp_debug = false;
# Use these rules for RHEL8/9
initial_seccomp_rules = ["access","arch_prctl","bind","brk","execve","faccessat2","flock","fstat","fstatfs","getcwd","lstat","prctl","recvmsg","readlink","rt_sigprocmask","seccomp","set_tid_address"]
both_seccomp_rules = ["clone","clone3","close","fcntl","getpid","ioctl","lseek","mmap","mprotect","munmap","newfstatat","open","openat","prlimit64","read","rseq","rt_sigaction","set_robust_list","stat","write"]
final_seccomp_rules = ["clock_nanosleep","connect","epoll_create","epoll_ctl","epoll_wait","exit","exit_group","fdatasync","fsync","ftruncate","futex","getdents","getdents64","getpeername","getppid","getrandom","getrlimit","gettid","getuid","getsockname","madvise","mkdir","nanosleep","poll","pread64","pwrite64","recvfrom","rename","rt_sigreturn","sched_getaffinity","sched_yield","select","sendto","setsockopt","shutdown","socket","sysinfo"]
# RHEL7 doesn't recognize some of the syscalls that are invoked on RHEL9 so it is
# necessary to use a variant set of syscalls
#initial_seccomp_rules = ["access","arch_prctl","bind","brk","execve","flock","fstatfs","getcwd","lstat","prctl","recvmsg","readlink","rt_sigprocmask","seccomp","set_tid_address"]
