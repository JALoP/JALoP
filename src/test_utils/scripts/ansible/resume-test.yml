---
# when testing with java subscriber, copy the correct java jar version to the jalop root and rename jnl_test-v2.jar
# ansible-playbook  src/test_utils/scripts/ansible/resume-test.yml -e cwd=`pwd` -e rcnt=6000 -e filter=yes -e subd=java
- hosts: localhost
  gather_facts: no

  vars:
    types: aljf
    resume: n
    mode: release
    rcnt: 10
    delay: 20
    log_dir: '{{cwd}}/test_logs'
    filter: "yes"
    subd: "c"
    fs: 

  tasks:
  - name: stop processes
    shell: |
      killall -9 jal-local-store || true
      killall -9 jal_subscribe || true
      killall -9 jaldb_inline_filter || true
      killall -9 jald || true
      killall -9 java || true
      rm -f {{cwd}}/jald_filter_socket*
      rm -f {{cwd}}/*.sock

  - name: clear databases
    shell: |
      cd '{{cwd}}'
      rm -fr testdb
      rm -fr subdb
      mkdir testdb
      mkdir subdb
      cp test-input/LMDB_CONFIG testdb
      cp test-input/LMDB_CONFIG subdb
    when: resume == "n"

  - name: clear logs
    shell: |
      rm -fr '{{log_dir}}'
      mkdir -p '{{log_dir}}'

  - name: make test file
    shell: |
      cd '{{cwd}}'
      zip big.zip test-input/*
      mv big.zip test-input/

  - name: start local store
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      umask 027
      ./{{mode}}/bin/jal-local-store -c ./test-input/local_store.cfg --no-daemon 2>{{log_dir}}/ls.err 1>{{log_dir}}/ls.out &

  - name: start Rust filter
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      RUST_LOG=debug ./{{mode}}/bin/jaldb_inline_filter -c ./test-input/jaldb-filter.toml -d ./testdb 2>{{log_dir}}/jald_filter.err 1>{{log_dir}}/jald_filter.out &
    when: filter == "yes"

  - name: start subscriber
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      ./{{mode}}/bin/jal_subscribe -c ./test-input/jal_subscribe.cfg -d {{fs}} 2>{{log_dir}}/subd.err 1>{{log_dir}}/subd.out &
    when: subd == "c"

  - name: start java subscriber
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      java -jar jnl_test-v2.jar test-input/sampleHttpSubscriber.json  2>{{log_dir}}/subd.err 1>{{log_dir}}/subd.out &
    when: subd == "java"

  - name: start jald w/filter
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      ./{{mode}}/bin/jald -c ./test-input/jald_multi_subs.cfg --no-daemon -d -f 2>{{log_dir}}/jald.err 1>{{log_dir}}/jald.out &
    when: filter == "yes"

  - name: start jald wo/filter
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      ./{{mode}}/bin/jald -c ./test-input/jald_multi_subs.cfg --no-daemon -d 2>{{log_dir}}/jald.err 1>{{log_dir}}/jald.out &
    when: filter != "yes"

  - name: sleep
    shell: |
      sleep 2

  - name: send logs
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    async: 3600
    poll: 0
    command:
        chdir: '{{cwd}}'
        cmd: './{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t l'
    when: '"l" in types'

  - name: send audits
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    async: 3600
    poll: 0
    command:
        chdir: '{{cwd}}'
        cmd: './{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t a'
    when: '"a" in types'
  
  - name: send jaf audits
    async: 3600
    poll: 0
    shell: |
        cd '{{cwd}}'
        # valgrind --leak-check=full --show-leak-kinds=all --fair-sched=yes --xml=yes --track-origins=yes --xml-file={{log_dir}}/valgrind-jafgen.xml 
        jafgen -c ./test-input/jaf/jaf.cfg -p ./test-input/jaf/manyEvents.xml -i ./test-input/jaf/manyEvents.dat -e -j -s ./jal.sock -x ./test-input/schemas 2>{{log_dir}}/jafgen.err 1>{{log_dir}}/jafgen.out &
    when: '"g" in types'

  - name: send journals
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    async: 3600
    poll: 0
    command:
        chdir: '{{cwd}}'
        cmd: './{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/big.zip -n {{rcnt}} -t j'
    when: '"j" in types'

  - name: send journals FDs
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    async: 3600
    poll: 0
    command:
        chdir: '{{cwd}}'
        cmd: './{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/big.zip -n {{rcnt}} -t f'
    when: '"f" in types'

  - name: interrupt processes
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      sleep 1
      killall -9 jald || true
      killall -9 jaldb_inline_filter || true
      sleep 5    
      # sed -i 's/\["on"\]/\["off"\]/g' test-input/jald_multi_subs.cfg
      if [[ '{{filter}}' == 'yes' ]]; then
        RUST_LOG=debug ./{{mode}}/bin/jaldb_inline_filter -c ./test-input/jaldb-filter.toml -d ./testdb 2>{{log_dir}}/jald_filter.err 1>{{log_dir}}/jald_filter.out &
        ./{{mode}}/bin/jald -c ./test-input/jald_multi_subs.cfg --no-daemon -d -f 2>{{log_dir}}/jald.err 1>{{log_dir}}/jald.out &
      else
        ./{{mode}}/bin/jald -c ./test-input/jald_multi_subs.cfg --no-daemon -d  2>{{log_dir}}/jald.err 1>{{log_dir}}/jald.out &
      fi
      sleep 5
      # sed -i 's/\["off"\]/\["on"\]/g' test-input/jald_multi_subs.cfg
    when: resume == "n"

  - name: sleep
    shell: |
      sleep '{{delay}}'
      PID=`/usr/sbin/pidof ./{{mode}}/bin/jald`
      (( cpu="10" ))
      (( retry_count=0 ))
      while [ $cpu != "0.0" ]
      do
        sleep 1
        cpu=`top -b -n 1 -p $PID | grep -P -m 7 $PID | awk '{print $9}'`
        if [[ $cpu == "0.0" ]] && [[ $retry_count < 5 ]]; then
          (( cpu="10" ))
          (( retry_count=$retry_count + 1 ))
        else
          (( retry_count=0 ))
        fi
      done
      exit 0

  - name: jaldb_tool testdb
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    command:
        chdir: '{{cwd}}'
        cmd: ./{{mode}}/bin/jaldb_tool -h testdb
    register: jaldb_tool_testdb_output

  - name: jaldb_tool subdb
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    command:
        chdir: '{{cwd}}'
        cmd: ./{{mode}}/bin/jaldb_tool -h subdb
    register: jaldb_tool_subdb_output

  - name: jaldb_tool output
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      echo "[" > {{log_dir}}/jaldb_tool_output.txt
      echo '{{ jaldb_tool_testdb_output.stdout }}' >> {{log_dir}}/jaldb_tool_output.txt
      echo "," >> {{log_dir}}/jaldb_tool_output.txt
      echo '{{ jaldb_tool_subdb_output.stdout }}' >> {{log_dir}}/jaldb_tool_output.txt
      echo "]" >> {{log_dir}}/jaldb_tool_output.txt

  - name: jaldb_tail
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      ./{{mode}}/bin/jaldb_tail -h testdb/ -t l|grep -P -m 1 '\dT\d'|sed 's/_.*//'|sed 's/\s//'
    register: jaldb_tail_output
    when: mode == "debug"

  - name: jal_dump
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      ./{{mode}}/bin/jal_dump -h testdb/ -u '{{ jaldb_tail_output.stdout }}' -d m -t l
    register: jal_dump_output
    when: mode == "debug"

  - name: jal_dump output
    shell: |
      cd '{{cwd}}'
      echo '{{ jal_dump_output.stdout }}' > {{log_dir}}/jaldb_tool_meta_output.txt
    when: mode == "debug"

  - name: end processes
    shell: |
      killall jal-local-store || true
      killall jald || true
      sleep 2
      killall jal_subscribe || true
      killall jaldb_inline_filter || true
      killall java || true
      rm -f {{cwd}}/jald_filter_socket*
      rm -f {{cwd}}/*.sock
      rm '{{cwd}}'/test-input/big.zip

  - name: build cov report
    tags: cov
    shell: |
      cd '{{cwd}}'
      REPORT_DIR=cov_integration
      INFO_FILE=integration_coverage.info
      REPORT_INFO_FILE=$REPORT_DIR/$INFO_FILE
      mkdir -p $REPORT_DIR
      rm -fr $REPORT_DIR/*
      lcov -q --directory '{{cwd}}' -b '{{cwd}}' --capture --output-file $REPORT_INFO_FILE 
      lcov -q --remove $REPORT_INFO_FILE /usr/\* --output-file $REPORT_INFO_FILE
      lcov -q --remove $REPORT_INFO_FILE '{{cwd}}'/debug/src/\*/test/\* --output-file $REPORT_INFO_FILE
      lcov -q --remove $REPORT_INFO_FILE '{{cwd}}'/src/\*/test/\* --output-file $REPORT_INFO_FILE
      cd $REPORT_DIR
      genhtml -t INFO_FILE --show-details -k $INFO_FILE -o ./
    when: mode == "debug"
    
