---
# ansible-playbook  src/test_utils/scripts/ansible/valgrind.yml  -e cwd=`pwd` -e rcnt=10  -e mode=debug
- hosts: localhost
  gather_facts: no

  vars:
    log_dir: '{{cwd}}/test_logs'
    valgrind_out_dir: '{{log_dir}}/valgrind'
    valgrind_options: "valgrind --suppressions='{{cwd}}/src/test_utils/scripts/valgrind/jalop.supp' --gen-suppressions=all --leak-check=full --show-leak-kinds=all --fair-sched=yes --track-origins=yes --xml=yes --xml-file={{valgrind_out_dir}}"
    types: aljf
    mode: release
    delay: 25
    fs: 
    jald: "c"

  tasks:
  - name: stop processes
    shell: |
      killall -9 jal-local-store || true
      killall -9 jal_subscribe || true
      killall -9 jaldb_inline_filter || true
      killall -9 jald || true
      killall -9 jald_rs || true
      killall -9 memcheck-amd64- || true
      #rm -f {{cwd}}/jald_record_socket
      rm -f {{cwd}}/jald_filter_socket*
      rm -f {{cwd}}/*.sock
      rm -fr {{log_dir}}

  - name: clear databases
    shell: |
      cd '{{cwd}}'
      rm -fr testdb
      rm -fr subdb
      mkdir testdb
      mkdir subdb
      cp test-input/LMDB_CONFIG testdb
      cp test-input/LMDB_CONFIG subdb
      mkdir -p {{valgrind_out_dir}}/tool_output

  - name: start local store
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      umask 027
      {{valgrind_options}}/valgrind-localstore.xml ./{{mode}}/bin/jal-local-store -c ./test-input/local_store.cfg --no-daemon 2>{{log_dir}}/local_store.err 1>{{log_dir}}/local_store.out &

  - name: start Rust Filter
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      RUST_LOG=debug {{valgrind_options}}/valgrind-rust-filter.xml ./{{mode}}/bin/jaldb_inline_filter -c ./test-input/jaldb-filter.toml -d ./testdb  2>{{log_dir}}/jaldb_inline_filter.err 1>{{log_dir}}/jaldb_inline_filter.out &

  - name: start subscriber
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      {{valgrind_options}}/valgrind-subscriber.xml ./{{mode}}/bin/jal_subscribe -c ./test-input/jal_subscribe.cfg -d {{fs}} 2>{{log_dir}}/subscriber.err 1>{{log_dir}}/subscriber.out &

  - name: start jald
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      sleep 10
      {{valgrind_options}}/valgrind-publisher.xml ./{{mode}}/bin/jald -c ./test-input/jald_multi_subs.cfg --no-daemon -d -f  2>{{log_dir}}/jald.err 1>{{log_dir}}/jald.out &
    when: jald == "c"

  - name: start jald_rs w/filter
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      RUST_LOG=warn {{valgrind_options}}/valgrind-rust-publisher.xml ./{{mode}}/bin/jald_rs -c ./test-input/jald.toml 2>{{log_dir}}/jald_rs.err 1>{{log_dir}}/jald_rs.out &
    when: jald == "rust"

  - name: sleep
    shell: |
      sleep 15

  - name: send logs
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    command:
        chdir: '{{cwd}}'
        cmd: '{{valgrind_options}}/valgrind-producer-log.xml ./{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t l'
        #cmd: './{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t l'
    when: '"l" in types'

  - name: send journals
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    command:
        chdir: '{{cwd}}'
        cmd: './{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t j'
    when: '"j" in types'

  - name: send journal FDs
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    command:
        chdir: '{{cwd}}'
        #cmd: '{{valgrind_options}}/valgrind-producer-journal-fd.xml ./{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t f'
        cmd: './{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t f'
    when: '"f" in types'

  - name: send audits
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    command:
        chdir: '{{cwd}}'
        #cmd: '{{valgrind_options}}/valgrind-producer-audit.xml ./{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t a'
        cmd: './{{mode}}/bin/jalp_test -j ./jal.sock -a ./test-input/sample2.cfg -p ./test-input/good_audit_input.xml -n {{rcnt}} -t a'
    when: '"a" in types'

  - name: sleep
    shell: |
      sleep '{{delay}}'
      PID=`/usr/sbin/pidof ./{{mode}}/bin/jald`
      if [[ '{{jald}}' == 'rust' ]]; then
        PID=`/usr/sbin/pidof ./{{mode}}/bin/jald_rs`
      fi
      (( cpu="10" ))
      (( retry_count=0 ))
      while [ $cpu != "0.0" ]
      do
        sleep 1
        cpu=`top -b -n 1 -p $PID | grep -P -m 7 $PID | awk '{print $9}'`
        if [[ $cpu == "0.0" ]] && [[ $retry_count < 5 ]]; then
          (( cpu="10" ))
          (( retry_count=$retry_count + 1 ))
        else
          (( retry_count=0 ))
        fi
      done
      exit 0

  - name: jaldb_tool testdb
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    command:
        chdir: '{{cwd}}'
        cmd: '{{valgrind_options}}/valgrind-jaldb_tool.xml ./{{mode}}/bin/jaldb_tool -h testdb'
    register: jaldb_tool_testdb_output

  - name: jaldb_tool subdb
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    command:
        chdir: '{{cwd}}'
        cmd: ./{{mode}}/bin/jaldb_tool -h subdb
    register: jaldb_tool_subdb_output

  - name: jaldb_tool output
    shell: |
      cd '{{cwd}}'
      echo "[" > {{log_dir}}/jaldb_tool_output.txt
      echo '{{ jaldb_tool_testdb_output.stdout }}' >> {{log_dir}}/jaldb_tool_output.txt
      echo "," >> {{log_dir}}/jaldb_tool_output.txt
      echo '{{ jaldb_tool_subdb_output.stdout }}' >> {{log_dir}}/jaldb_tool_output.txt
      echo "]" >> {{log_dir}}/jaldb_tool_output.txt

  - name: jaldb_tail
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      {{valgrind_options}}/valgrind-jaldb_tail.xml ./{{mode}}/bin/jaldb_tail -h testdb/ -t j > out_tail
      cat out_tail | grep -P -m 1 '\dT\d'|sed 's/_.*//'|sed 's/\s//'
    register: jaldb_tail_output

  - name: jal_dump
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      rm -f out_tail
      {{valgrind_options}}/valgrind-jal_dump.xml ./{{mode}}/bin/jal_dump -h testdb/ -u '{{ jaldb_tail_output.stdout }}' -d m -t j
    register: jal_dump_output

  - name: jal_dump output
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      echo '{{ jal_dump_output.stdout }}' > {{log_dir}}/jaldb_tool_meta_output.txt

  - name: end process
    shell: |
      SPID=`ps aux | grep valgrind | grep jald.cfg | awk '{print $2}'`
      if [[ '{{jald}}' == 'rust' ]]; then
        SPID=`ps aux | grep valgrind | grep jald.toml | awk '{print $2}'`
      fi
      kill $SPID || true
      exit 0
    ignore_errors: true

  - name: end processes
    shell: |
      killall jal-local-store || true
      killall jal_subscribe || true
      killall jaldb_inline_filter || true
      killall jald || true
      killall jald_rs || true
      sleep 20
      killall memcheck-amd64- || true
      rm -f {{cwd}}/jald_record_socket_*
      rm -f {{cwd}}/jald_filter_socket
      rm -f {{cwd}}/*.sock

  - name: jal_purge
    environment:
      LD_LIBRARY_PATH: '{{cwd}}/{{mode}}/lib'
    shell: |
      cd '{{cwd}}'
      rm -f out_tail
      {{valgrind_options}}/valgrind-jal_purge.xml ./{{mode}}/bin/jal_purge -h testdb/ -t l -b 2025-12-29T00:00:00 -d

  - name: combine valgrind xml
    shell: |
      cd '{{cwd}}'
      sleep 120
      python3 '{{cwd}}/src/test_utils/scripts/valgrind/create_html.py' '{{valgrind_out_dir}}' 1> '{{valgrind_out_dir}}/tool_output/valgrind_errors_v2.xml'

  - name: build valgrind html
    shell: |
      cd '{{cwd}}'
      xsltproc '{{cwd}}/src/test_utils/scripts/valgrind/all-valgrind-xml-html.xslt' '{{valgrind_out_dir}}/tool_output/valgrind_errors_v2.xml' 1> '{{valgrind_out_dir}}/tool_output/valgrind_errors_v2.html'

  - name: build cov report
    shell: |
      cd '{{cwd}}'
      mkdir cov_integration
      rm -fr cov_integration/*
      lcov -q -t JalopIntegrationTest --directory debug -b '{{cwd}}' --capture --output-file cov_integration/app.info
      lcov -q --remove cov_integration/app.info /usr/\* --output-file cov_integration/app.info
      lcov -q --remove cov_integration/app.info '{{cwd}}'/debug/src/\*/test/\* --output-file cov_integration/app.info
      lcov -q --remove cov_integration/app.info '{{cwd}}'/src/\*/test/\* --output-file cov_integration/app.info
      cd cov_integration
      genhtml --show-details -k app.info
    when: mode == "future"
